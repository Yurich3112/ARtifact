<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ghost of the Past - ARtifact</title>
    <link rel="stylesheet" href="ghost-of-past.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" rel="stylesheet" />
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-spinner"></div>
        </div>
    </div>

    <div class="app-container">
        <!-- Header with back button -->
        <header>
            <a href="index.html" class="back-button">
                <span class="material-symbols-outlined">arrow_back</span>
            </a>
            <h1 data-i18n="ghost.title">Ghost of the Past</h1>
            <div class="header-spacer"></div>
        </header>

        <!-- City Selector and Search Bar -->
        <div class="search-container">
            <div class="city-selector">
                <span class="material-symbols-outlined city-icon">location_city</span>
                <select id="city-select" class="city-dropdown">
                    <option value="all">All Cities</option>
                    <option value="opole">Opole</option>
                    <option value="prague">Prague</option>
                </select>
            </div>
            <div class="search-box">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" id="search-input" data-i18n-placeholder="ghost.searchPlaceholder" placeholder="Search monuments...">
            </div>
        </div>

        <!-- Map Container -->
        <div id="map" class="map-container"></div>

        <!-- Monument Tiles -->
        <div class="monuments-section">
            <h2 data-i18n="ghost.nearbyMonuments">Nearby Monuments</h2>
            <div class="monuments-grid" id="monuments-grid">
                <!-- Monument tiles will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.js"></script>
    <script type="module" src="ghost-of-past.js"></script>
</body>
</html>
